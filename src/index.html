<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To Do List</title>
    <link href="./output.css" rel="stylesheet">
    <style>
        .delete-sty{
            background-color:#dc3545;
            color: white;
            border: none;
            padding: 2px 8px;
            border-radius: 6px;
            cursor: pointer;
            margin-left: 15px;
        }
        .delete-sty:hover{
            background-color: #b02a37;
        }

        .li-sty{
            border: 1px solid grey;
            border-radius: 2px ;
            margin-bottom: 10px;
            padding: 5px 20px ;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        #addButton:hover{
            background-color: blue;
        }
    </style>
</head>
<body>
    <div class=" min-h-screen flex justify-center items-center">
        <div class=" w-[350px] min-h-[160px] bg-white p-6 rounded-xl shadow-xl flex flex-col gap-6 items-center">
        <h1>My To Do List</h1>
    
    <div class="flex text-center justify-center items-center flex-row gap-5">
        <input type="text" id="taskInput" placeholder="Enter Your Task" class="flex-1 min-w-0 border border-indigo-400 rounded-md px-3 py-2 text-sm outline-none focus:border-indigo-600 ">
        <button id="addButton" class="bg-indigo-500 text-white px-3 py-1 rounded-[7px] text-sm  hover:cursor-pointer">Add</button>
    </div>
    <ul id="taskList"></ul>
    </div>
    </div>
    
    <script>
        const taskInput = document.getElementById("taskInput");
        const addButton = document.getElementById("addButton");
        const taskList = document.getElementById("taskList");

        addButton.addEventListener("click", function(){

            const taskText = taskInput.value.trim();
            if(taskText === ""){
                alert("Please Enter a Task");
                return;
            }
            
      

        const li = document.createElement("li");
        const span = document.createElement("span");
        span.textContent= taskText;
        li.appendChild(span);

        li.classList.add("li-sty");



        const deleteBtn = document.createElement("button");
        deleteBtn.textContent="Delete";
        deleteBtn.classList.add("delete-sty");

        deleteBtn.addEventListener("click",function(){
            li.remove();
        });
        li.appendChild(deleteBtn);

        taskList.appendChild(li);

        taskInput.value="";

        taskInput.focus();
          })

          taskInput.addEventListener("keydown", function(event){
            if(event.key === "Enter"){
                addButton.click();
            }
          })
    </script>
</body>
</html>
